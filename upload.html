  <script>
    async function enforceClerkSession() {
      if (!window.Clerk) {
        window.location.replace("projects.html");
        return;
      }

      await window.Clerk.load();

      if (!window.Clerk.user) {
        window.location.replace("projects.html");

      document.body.style.display = "";
    }

    enforceClerkSession();

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2rCOzAyc4zt6QQvBRKfdGJ9nYGmdvZPg",
      authDomain: "beljocorplbr-bed51.firebaseapp.com",
      projectId: "beljocorplbr-bed51",
      storageBucket: "beljocorplbr-bed51.firebasestorage.app",
      messagingSenderId: "288721107111",
      appId: "1:288721107111:web:554f08449e88096f930382",
      measurementId: "G-749Y0118Q3"
    };

    const CLOUDINARY_CLOUD_NAME = "pypeb1m9";
    const CLOUDINARY_UPLOAD_PRESET = "adosa9kb";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const projectsRef = collection(db, "projects");

    const uploadForm = document.getElementById("uploadMediaForm");
    const uploadInput = document.getElementById("projectMediaInput");
    const tableBody = document.getElementById("projectMediaTableBody");
    const uploadError = document.getElementById("uploadError");

    let projectsCache = [];

    async function requireClerkAdmin() {
      if (!window.Clerk) {
        window.location.replace("projects.html");
        return false;
      }

      await window.Clerk.load();
      if (!window.Clerk.user) {
        window.location.replace("projects.html");
        return false;
      }

      return true;
    }

    function escapeHtml(value) {
      const element = document.createElement("span");
      element.textContent = value || "";
      return element.innerHTML;
    }

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,
        { method: "POST", body: formData }
      );

      if (!response.ok) {
        throw new Error(await response.text());
      }

      const result = await response.json();
      return {
        mediaUrl: result.secure_url,
        mediaType: result.resource_type === "video" ? "Video" : "Photo",
        publicId: result.public_id
      };
    }

    function renderTable(search = "") {
      const queryValue = String(search).trim().toLowerCase();

      const filtered = projectsCache.filter(item =>
        [item.title, item.location, item.type]
          .join(" ")
          .toLowerCase()
          .includes(queryValue)
      );

      if (!filtered.length) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-muted py-5">
              <i class="bi bi-images fs-2 d-block mb-2"></i>
              No project media found.
            </td>
          </tr>`;
        return;
      }

      tableBody.innerHTML = filtered.map(item => `
        <tr>
          <td class="ps-3">
            ${item.type === "Video"
              ? `<video src="${item.mediaUrl}" muted preload="metadata"
                   style="width:72px;height:52px;object-fit:cover;border-radius:6px"></video>`
              : `<img src="${item.mediaUrl}" alt="${escapeHtml(item.title)}"
                   style="width:72px;height:52px;object-fit:cover;border-radius:6px">`}
          </td>
          <td><strong>${escapeHtml(item.title)}</strong></td>
          <td>${escapeHtml(item.location || "-")}</td>
          <td>
            <span class="badge ${item.type === "Video" ? "text-bg-danger" : "text-bg-primary"}">
              ${escapeHtml(item.type)}
            </span>
          </td>
          <td>${item.createdAt?.toDate?.().toLocaleDateString() || "Just now"}</td>
          <td class="text-end pe-3">
            <button type="button" class="btn btn-sm btn-outline-primary me-1"
                    data-action="edit" data-id="${item.id}">
              <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger"
                    data-action="delete" data-id="${item.id}">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join("");
    }

    uploadForm.addEventListener("submit", async event => {
      event.preventDefault();

      const file = uploadInput.files?.[0];
      if (!file) {
        uploadError.textContent = "Please choose a file.";
        uploadError.classList.remove("d-none");
        return;
      }

      const submitButton = uploadForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = "Uploading...";

      try {
        const uploaded = await uploadToCloudinary(file);

        await addDoc(projectsRef, {
          title: document.getElementById("projectMediaTitle").value.trim() || file.name,
          location: document.getElementById("projectMediaLocation").value.trim(),
          mediaUrl: uploaded.mediaUrl,
          publicId: uploaded.publicId,
          type: uploaded.mediaType,
          uploadedBy: window.Clerk.user?.primaryEmailAddress?.emailAddress || "Admin",
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        uploadForm.reset();
        uploadError.classList.add("d-none");

        bootstrap.Modal.getInstance(
          document.getElementById("uploadProjectMediaModal")
        )?.hide();
      } catch (error) {
        console.error(error);
        uploadError.textContent = "Upload failed. Check the file and try again.";
        uploadError.classList.remove("d-none");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Upload";
      }
    });

    tableBody.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const project = projectsCache.find(item => item.id === button.dataset.id);
      if (!project) return;

      if (button.dataset.action === "edit") {
        document.getElementById("editProjectId").value = project.id;
        document.getElementById("editProjectTitle").value = project.title || "";
        document.getElementById("editProjectLocation").value = project.location || "";
        document.getElementById("editProjectType").value = project.type || "Photo";

        bootstrap.Modal.getOrCreateInstance(
          document.getElementById("editProjectMediaModal")
        ).show();
      }

      if (button.dataset.action === "delete") {
        document.getElementById("deleteProjectId").value = project.id;

        bootstrap.Modal.getOrCreateInstance(
          document.getElementById("deleteProjectMediaModal")
        ).show();
      }
    });

    document.getElementById("saveProjectEditButton").addEventListener("click", async () => {
      const id = document.getElementById("editProjectId").value;
      if (!id) return;

      await updateDoc(doc(db, "projects", id), {
        title: document.getElementById("editProjectTitle").value.trim(),
        location: document.getElementById("editProjectLocation").value.trim(),
        type: document.getElementById("editProjectType").value,
        updatedAt: serverTimestamp()
      });

      bootstrap.Modal.getInstance(
        document.getElementById("editProjectMediaModal")
      )?.hide();
    });

    document.getElementById("confirmProjectDeleteButton").addEventListener("click", async () => {
      const id = document.getElementById("deleteProjectId").value;
      if (!id) return;

      await deleteDoc(doc(db, "projects", id));

      bootstrap.Modal.getInstance(
        document.getElementById("deleteProjectMediaModal")
      )?.hide();
    });

    document.getElementById("headerMediaSearch").addEventListener("input", event => {
      document.getElementById("tableMediaSearch").value = event.target.value;
      renderTable(event.target.value);
    });

    document.getElementById("tableMediaSearch").addEventListener("input", event => {
      document.getElementById("headerMediaSearch").value = event.target.value;
      renderTable(event.target.value);
    });

    document.addEventListener("click", event => {
      const fullscreenButton = event.target.closest("#btn-fullscreen");
      if (!fullscreenButton) return;

      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    const authenticated = await requireClerkAdmin();
    if (authenticated) {
      onSnapshot(
        query(projectsRef, orderBy("createdAt", "desc")),
        snapshot => {
          projectsCache = snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          renderTable();
        },
        error => console.error("Firestore listener failed:", error)
      );
    }
  </script>

  <script>
    async function signOutAdmin() {
      if (!window.Clerk) {
        window.location.replace("projects.html");
        return;
      }

      await window.Clerk.load();

      await window.Clerk.signOut({
        redirectUrl: new URL("projects.html", window.location.href).href
      });
    }

    document
      .getElementById("clerk-signout-button")
      ?.addEventListener("click", signOutAdmin);
  </script>
